:root{

*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(1000px 500px at 50% -5%,#ffffff 0%,var(--bg) 60%) fixed,var(--bg);color:var(--text);

header.top .wrap.head-wrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:14px 20px}
.head-right{justify-self:end;display:flex;align-items:center;gap:12px}
.logo{font-weight:800;font-size:20px;white-space:nowrap;color:var(--ink)}

.gh-btn svg{flex:none}
.tabs{display:flex;gap:10px;margin:22px 0 4px}
.tabs-head{margin:0;justify-self:center}
.tabs-head button{padding:8px 18px;font-size:14px}
.search-bar{margin:18px 0 6px}
.tabs button{background:#fff;border:1px solid var(--line);border-radius:999px;padding:10px 24px;

.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.hero{margin:18px 0 6px;background:#fff;border:1px solid var(--line);border-radius:20px;

.hero::before{content:"";position:absolute;inset:0;

  background-size:34px 34px;pointer-events:none}
.hero::after{content:"";position:absolute;right:-100px;top:50%;width:360px;height:360px;transform:translateY(-50%);
  border:2px solid rgba(17,20,24,.07);border-radius:50%;pointer-events:none}
.hero-inner{position:relative;display:flex;gap:44px;align-items:center;justify-content:space-between}
.hero-label{font-size:19px;letter-spacing:8px;color:var(--muted);margin-bottom:16px}
.hero-title{font-size:66px;font-weight:800;color:var(--ink);line-height:1.15;margin-bottom:12px;white-space:nowrap}
.hero-sub{font-size:21px;color:#4b5563;margin-bottom:28px}
.hero-sub b{color:var(--ink)}
.hero-row{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.hero-invite{background:var(--ink);color:#fff;border:none;border-radius:999px;

.hero-invite:hover{opacity:.88}
.hero-side{color:var(--muted);font-size:17px}
.hero-cards{display:flex;flex-direction:column;gap:18px;min-width:300px;position:relative;z-index:1}
.hero-card{background:#fff;border:1.5px solid var(--line);border-radius:16px;

.check{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;flex:none;

.hero-card-amt{font-size:26px;font-weight:800;color:var(--ink);padding-left:36px;white-space:nowrap}

  .hero-title{font-size:42px;white-space:normal}

.pill.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700}

.badge{font-size:12px;padding:3px 10px;border-radius:999px;display:inline-block;width:fit-content;font-weight:600}
.badge.ok{background:#e6f7ef;color:#0e7a4f;border:1px solid #bfe8d2}
.badge.cross{background:#fdf3e0;color:#9a6b12;border:1px solid #f0dcae}
.result{color:var(--ink);font-weight:800;font-size:16px}
.author{color:var(--muted);font-size:13px}
.desc{color:#3d434d;font-size:14px;flex:1}
.xbtn{align-self:flex-start;background:var(--soft);border:1px solid var(--line);color:var(--ink);

  return `<span class="badge ${cls}">${txt}</span>`;

function mediaHTML(c){
  if (!c.m || !c.m.length) return "";
  const it = c.m[0];
  if (it.k === "vid"){
    const poster = it.p ? ` poster="${it.p}"` : "";
    return `<video class="card-media" controls preload="none" playsinline${poster} src="${it.u}"></video>`;
  }
  return `<a href="${it.f || it.u}" target="_blank" rel="noopener"><img class="card-media" loading="lazy" src="${it.u}" alt=""></a>`;
}
function card(c){
  const t = lang === "zh" ? c.t : c.te;
  const a = lang === "zh" ? c.a : c.ae;
  const r = lang === "zh" ? c.r : c.re;
  const d = lang === "zh" ? c.d : c.de;
  const x = c.x ? `<a class="xbtn" href="${c.x}" target="_blank" rel="noopener">${T().viewX}</a>` : "";
  return `<article class="card"><div>${badge(c.b)}</div><h3>${t}</h3>
    ${mediaHTML(c)}
    <div class="result">${r}</div><div class="author">${a}</div>
    <p class="desc">${d}</p>${x}</article>`;
}

     <div class="stat"><b>${DATA.meta.updated}</b><span>${T().updated}</span></div>`;

    `<button class="pill on" data-cat="all">${T().all}<span class="n">${DATA.cases.length}</span></button>` +
    DATA.cats.map(c => `<button class="pill" data-cat="${c.id}">${catName(c)}<span class="n">${counts[c.id]||0}</span></button>`).join("");
  document.querySelectorAll(".pill").forEach(p =>
    p.addEventListener("click", () => { activeCat = p.dataset.cat; shown = 24; render(); }));
  $("#sortbar").innerHTML =
    `<span class="lbl">${T().sortLabel}</span>` +
    `<button data-sort="new" class="${sortMode === "new" ? "on" : ""}">${T().sortNew}</button>` +
    `<button data-sort="old" class="${sortMode === "old" ? "on" : ""}">${T().sortOld}</button>` +
    `<button data-onlyx="1" class="${onlyX ? "on" : ""}">${T().onlyX}</button>`;
  document.querySelectorAll("#sortbar button[data-sort]").forEach(b =>
    b.addEventListener("click", () => { sortMode = b.dataset.sort; shown = 24; renderAll(); }));
  document.querySelectorAll("#sortbar button[data-onlyx]").forEach(b =>
    b.addEventListener("click", () => { onlyX = !onlyX; shown = 24; renderAll(); }));
  render();
}
function render(){
  const q = $("#q").value.trim().toLowerCase();
  if (q !== lastQ){ lastQ = q; shown = 24; }
  let list = DATA.cases.filter(c =>
    (activeCat === "all" || c.c === activeCat) &&
    (!onlyX || c.x) &&
    (!q || (c.t + c.te + c.a + c.ae + c.d + c.de + c.r + c.re).toLowerCase().includes(q)));
  if (sortMode === "new") list = list.slice().reverse();
  const total = list.length;
  const page = list.slice(0, shown);
  $("#grid").innerHTML = page.length ? page.map(card).join("")
    : `<div class="empty">${T().empty}</div>`;
  const more = total - shown;
  const btn = $("#loadMore");
  if (more > 0){ btn.style.display = ""; btn.textContent = T().loadMore + " · " + T().moreLeft(more); }
  else btn.style.display = "none";
  document.querySelectorAll(".pill").forEach(p =>
    p.classList.toggle("on", p.dataset.cat === activeCat));
}

const ISSUES_API = "https://api.github.com/repos/jaxxchen003/muse-use-cases/issues?labels=invite-code&state=open&per_page=100";
let INVITES = [];
function parseInvite(issue){
  const body = issue.body || "";
  const mCode = body.match(/###\s*你的 Muse 邀请码\s*\n+#?\s*([A-Za-z0-9]{4,12})/)
             || issue.title.match(/\[邀请码\]\s*([A-Za-z0-9]{4,12})/)
             || issue.title.match(/(?:invite code|邀请码)[:：]\s*([A-Za-z0-9]{4,12})/i)
             || body.match(/invite code[,\s]+(?:as invited[:：]?\s*)?([A-Za-z0-9]{4,12})/i);
  const mUsed = body.match(/###\s*已使用次数\s*\n+#?\s*(\d+)/);
  const mTotal = body.match(/###\s*邀请码总名额[^\n]*\s*\n+#?\s*(\d+)/);
  const mIntro = body.match(/###\s*一句话介绍\s*\n+#?\s*([^\n#]+)/);
  return {
    code: mCode ? mCode[1].toUpperCase() : null,
    used: mUsed ? parseInt(mUsed[1], 10) : null,
    total: mTotal ? parseInt(mTotal[1], 10) : null,
    intro: mIntro ? mIntro[1].trim().replace(/^_?None_?$/, "") : "",
    user: issue.user.login, url: issue.html_url,
    date: (issue.created_at || "").slice(0, 10)
  };
}
function remainingOf(inv){
  if (inv.used !== null && inv.total !== null) return Math.max(inv.total - inv.used, 0);
  return null;
}
function inviteCardHTML(inv, isOwner){
  const meta = [];
  if (inv.used !== null && inv.total !== null && inv.total > 0){
    const left = Math.max(inv.total - inv.used, 0);
    const pct = Math.min(inv.used / inv.total * 100, 100);
    meta.push(`<div class="progress"><div style="width:${pct}%"></div></div>`);
    meta.push(lang === "zh"
      ? `<div class="icode-meta">${T().usedWord} ${inv.used}${T().timesWord} · ${T().leftWord} ${left}${T().timesWord}</div>`
      : `<div class="icode-meta">${T().usedWord} ${inv.used} · ${left} ${T().leftWord}</div>`);
  } else if (inv.used !== null){
    meta.push(lang === "zh"
      ? `<div class="icode-meta">${T().usedWord} ${inv.used}${T().timesWord}</div>`
      : `<div class="icode-meta">${T().usedWord} ${inv.used}</div>`);
  }
  const spent = remainingOf(inv) === 0;
  return `<article class="icode${spent ? " spent" : ""}">
    ${isOwner ? `<span class="owner-tag">${T().ownerBadge}</span>` : ""}
    <div class="icode-top"><code data-code="${inv.code}">${inv.code}</code>
      <button class="copybtn" data-code="${inv.code}">${T().copy}</button></div>
    ${meta.join("")}
    ${inv.intro ? `<p class="icode-intro">${inv.intro}</p>` : `<div class="icode-intro"></div>`}
    <div class="icode-foot"><span>@${inv.user} · ${inv.date}</span>
      ${inv.url ? `<a href="${inv.url}" target="_blank" rel="noopener">${T().updateUsage}</a>` : ""}</div>
  </article>`;
}
function renderInvites(){
  const owner = { code: "4P14HY", used: null, total: null,
    intro: lang === "zh" ? "站长 chen 的邀请码，欢迎使用" : "Owner chen's invite code — welcome aboard",
    user: "jaxxchen003", url: "", date: "" };
  let list = INVITES.filter(i => i.code && i.code !== "4P14HY");
  if (inviteLeftOnly) list = list.filter(i => remainingOf(i) !== 0);
  list.sort((a, b) => {
    const ra = remainingOf(a), rb = remainingOf(b);
    if (ra === 0 && rb !== 0) return 1;
    if (rb === 0 && ra !== 0) return -1;
    if (ra === null && rb !== null) return 1;
    if (rb === null && ra !== null) return -1;
    if (ra !== null && rb !== null) return rb - ra;
    return 0;
  });
  const nCodes = INVITES.filter(i => i.code).length + 1;
  $("#inviteCount").textContent = T().inviteCount(nCodes);
  const cards = [inviteCardHTML(owner, true)]
    .concat(list.map(i => inviteCardHTML(i, false)));
  $("#inviteGrid").innerHTML = cards.join("") ||
    `<div class="empty">${T().inviteEmpty}</div>`;
  document.querySelectorAll("[data-code]").forEach(el => {
    if (el.tagName === "CODE") el.addEventListener("click", () => copyCode(el.dataset.code, null));
  });
  document.querySelectorAll(".copybtn").forEach(btn =>
    btn.addEventListener("click", () => copyCode(btn.dataset.code, btn)));
}
function copyCode(code, btn){
  navigator.clipboard.writeText(code).then(() => {
    if (btn){ const old = btn.textContent; btn.textContent = T().copied;
      setTimeout(() => btn.textContent = old, 1500); }
  });
}
function loadInvites(){
  if (inviteLoaded) return;
  inviteLoaded = true;
  $("#inviteGrid").innerHTML = `<div class="empty">${T().inviteLoading}</div>`;
  fetch(ISSUES_API).then(r => r.json()).then(list => {
    INVITES = (Array.isArray(list) ? list : [])
      .filter(i => !i.pull_request).map(parseInvite);
    renderInvites();
  }).catch(() => {
    $("#inviteGrid").innerHTML = `<div class="empty">${T().inviteFail}</div>`;
  });
}

function renderAds(){
  $("#adSlots").innerHTML = [1, 2, 3].map(() =>
    `<a class="ad-slot" href="https://github.com/sponsors/jaxxchen003" target="_blank" rel="noopener">
      <span class="ad-slot-tag">${T().adSlot}</span>
      <span class="ad-slot-price">${T().adPrice}</span>
      <span class="ad-slot-cta">${T().adCta}</span>
    </a>`).join("");
}

/* ---------- view switching ---------- */
function switchView(v){
  activeView = v;
  $("#tabCases").classList.toggle("on", v === "cases");
  $("#tabInvite").classList.toggle("on", v === "invite");
  $("#viewCases").hidden = v !== "cases";
  $("#viewInvite").hidden = v !== "invite";
  $("#searchBox").classList.toggle("hidden", v !== "cases");
  if (v === "invite") loadInvites();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
$("#tabCases").addEventListener("click", () => switchView("cases"));
$("#tabInvite").addEventListener("click", () => switchView("invite"));
$("#langSel").addEventListener("change", e => { lang = e.target.value; applyLang(); });
$("#q").addEventListener("input", render);
$("#loadMore").addEventListener("click", () => { shown += 24; render(); });
$("#inviteLeftOnly").addEventListener("click", () => {
  inviteLeftOnly = !inviteLeftOnly;
  $("#inviteLeftOnly").textContent = inviteLeftOnly ? T().inviteAll : T().inviteLeftOnly;
  $("#inviteLeftOnly").classList.toggle("on", inviteLeftOnly);
  if (inviteLoaded) renderInvites();
});
$("#heroInviteBtn").addEventListener("click", () => {
  navigator.clipboard.writeText("4P14HY").then(() => {
    $("#heroInviteText").textContent = T().heroCopied;
    setTimeout(() => $("#heroInviteText").textContent = T().heroInvite, 1500);
  });
});

applyLang();
fetch("cases.json").then(r => r.json()).then(d => { DATA = d; renderAll(); })
  .catch(() => { $("#grid").innerHTML = `<div class="empty">${T().empty}</div>`; });
</script>
</body>
</html>
